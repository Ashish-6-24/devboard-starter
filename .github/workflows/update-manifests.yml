name: Update Helm Image Tags

on:
  workflow_call:
    inputs:
      image_tag:
        description: "Immutable image tag to write into Minikube Helm values"
        required: true
        type: string

jobs:
  update-manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update image tags in Minikube values
        uses: mikefarah/yq@v4.44.3
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        with:
          cmd: yq -i '.frontend.image.tag = strenv(IMAGE_TAG) | .backend.image.tag = strenv(IMAGE_TAG)' helm/devboard/values-minikube.yaml

      - name: Commit and push updated Helm values
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/devboard/values-minikube.yaml
          if git diff --cached --quiet; then
            echo "No Helm values changes to commit"
            exit 0
          fi
          git commit -m "chore: update Minikube Helm image tags to ${{ inputs.image_tag }} [skip ci]"
          git push
