apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devboard-ingress
  namespace: devboard
  labels:
    app.kubernetes.io/part-of: devboard
spec:
  ingressClassName: nginx
  rules:
    - host: devboard.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 4173
