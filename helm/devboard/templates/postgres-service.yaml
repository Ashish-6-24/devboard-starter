
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    {{- include "devboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  clusterIP: None
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: database
  ports:
    - name: postgres
      protocol: TCP
      port: {{ .Values.postgres.service.port }}
      targetPort: {{ .Values.postgres.service.port }}
