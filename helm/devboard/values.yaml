imagePullSecrets: []

frontend:
  replicaCount: 1

  image:
    repository: ashish0624/devboard-frontend
    tag: "feca0e4"
    pullPolicy: Always

  service:
    type: ClusterIP
    port: 4173
    targetPort: 4173
    nodePort: null

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

backend:
  replicaCount: 1

  image:
    repository: ashish0624/devboard-backend
    tag: "feca0e4"
    pullPolicy: Always

  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

postgres:
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent

  service:
    port: 5432

  storage:
    size: 1Gi
    storageClassName: ""

  auth:
    database: devboard
    username: devboard

  existingSecret: secret-devboard

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: devboard.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

