
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: devboard
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Ashish-6-24/devboard-starter.git
    targetRevision: main
    path: helm/devboard
    helm:
      valueFiles:
        - values-minikube.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: devboard-helm

  syncPolicy:
    automated:
      enabled: true
      selfHeal: true
      prune: false

    syncOptions:
      - CreateNamespace=true
